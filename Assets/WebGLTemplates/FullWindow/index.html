<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <!-- Tab and home-screen icons: the files sit next to this page in the template folder, and Unity copies them into the build -->
    <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <!-- Link previews (Discord, Slack, X, Facebook, ...). Previews need full URLs, so these point at the
         GitHub Pages address; update them if the game moves. -->
    <meta name="description" content="A fast online multiplayer shooter in your browser. Land a headshot and knock their cap off.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{{ PRODUCT_NAME }}}">
    <meta property="og:description" content="A fast online multiplayer shooter in your browser. Land a headshot and knock their cap off.">
    <meta property="og:url" content="https://steffhe.github.io/Capshots/">
    <meta property="og:image" content="https://steffhe.github.io/Capshots/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="The Capshots logo">
    <meta name="twitter:card" content="summary_large_image">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      /* touch-action: none keeps the browser from scrolling, zooming or going back on swipes,
         so every touch reaches the game's on-screen controls */
      #unity-canvas { display: block; width: 100%; height: 100%; background: #000; outline: none; touch-action: none; }
      body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      /* Phones held upright: the controls need the width, so ask to turn the phone */
      #rotate {
        display: none; position: absolute; inset: 0; z-index: 10; align-items: center; justify-content: center;
        padding: 24px; background: #000; color: #ccc; font: 16px/1.4 sans-serif; text-align: center;
      }
      @media (pointer: coarse) and (orientation: portrait) { #rotate { display: flex; } }
      #loading {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: 420px; max-width: 80vw; color: #ccc; font: 14px/1.4 sans-serif; text-align: center;
      }
      #loading-logo { display: block; width: 100%; height: auto; margin-bottom: 18px; }
      #loading-track { height: 6px; margin-top: 10px; background: #333; border-radius: 3px; overflow: hidden; }
      /* The blue of the cap in the logo */
      #loading-fill { width: 0; height: 100%; background: #016bad; transition: width 0.2s; }
      #message {
        position: absolute; left: 50%; top: 16px; transform: translateX(-50%); display: none;
        max-width: 90vw; padding: 10px 16px; border-radius: 4px; font: 14px/1.4 sans-serif;
        background: #fc3; color: #000;
      }
      #message.error { background: #c33; color: #fff; }
    </style>
  </head>
  <body>
    <!-- Fills the whole browser window. Unity resizes the game to match whenever the window changes. -->
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <img id="loading-logo" src="logo.png" alt="{{{ PRODUCT_NAME }}}">
      Loading...
      <div id="loading-track"><div id="loading-fill"></div></div>
    </div>
    <div id="message"></div>
    <div id="rotate">Turn your device sideways to play.</div>
    <script>
      var canvas = document.getElementById("unity-canvas");
      var loading = document.getElementById("loading");
      var message = document.getElementById("message");

      function showMessage(text, type) {
        message.textContent = text;
        message.className = type === "error" ? "error" : "";
        message.style.display = "block";
        if (type !== "error") setTimeout(function () { message.style.display = "none"; }, 6000);
      }

      // Phones and tablets: go fullscreen and landscape on the first touch, where the browser
      // allows it (iPhones don't, so there the browser bars stay). Browsers only allow this
      // in response to a touch, so it can't happen on load.
      if (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) {
        document.addEventListener("touchend", function goFullscreen() {
          document.removeEventListener("touchend", goFullscreen);
          var el = document.documentElement;
          var request = el.requestFullscreen || el.webkitRequestFullscreen;
          if (!request) return;
          try {
            var result = request.call(el);
            if (result && result.then) {
              result.then(function () {
                if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
              }).catch(function () {});
            }
          } catch (e) {}
        });
      }

      // Lock the mouse with raw input where the browser offers it (Chrome, Edge): mouse movement
      // then comes straight from the mouse instead of through the system's pointer, which cuts
      // the delay before the view turns and drops the system's pointer acceleration, like other
      // shooters. Browsers without it lock the mouse the usual way.
      (function () {
        var lock = canvas.requestPointerLock;
        if (!lock) return;
        var raw = true;
        canvas.requestPointerLock = function () {
          var el = this;
          if (!raw) return lock.call(el);
          var result;
          try { result = lock.call(el, { unadjustedMovement: true }); } catch (e) { raw = false; return lock.call(el); }
          // Older Chrome returns nothing; newer browsers return a promise that fails without raw input
          if (result && result.catch) {
            return result.catch(function (error) {
              if (!error || error.name !== "NotSupportedError") throw error;
              raw = false;
              return lock.call(el);
            });
          }
          return result;
        };
      })();

      // Right mouse button aims, so don't open the browser's menu
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: showMessage,
        // High-DPI screens (most laptops) would otherwise render 2-4x the pixels of the window.
        // 1.5 keeps the picture sharp while keeping the frame rate up.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.getElementById("loading-fill").style.width = (100 * progress) + "%";
        }).then(function () {
          loading.style.display = "none";
          canvas.focus();
        }).catch(function (error) {
          loading.style.display = "none";
          showMessage(String(error), "error");
        });
      };
      script.onerror = function () {
        loading.style.display = "none";
        showMessage("The game failed to load. Try reloading the page.", "error");
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
