name: Build

# Builds the Windows version of the game with GameCI (https://game.ci).
#  - Push a tag like v0.2 to build and publish a GitHub Release with the zipped game.
#    The tag (without the "v") becomes the game's version, which is also Photon's
#    matchmaking version, so different releases never share a room.
#  - Pull requests that touch the project get a test build, downloadable from the run.
#  - "Run workflow" on the Actions tab builds on demand.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   UNITY_LICENSE   contents of your Unity license file (Unity_lic.ulf)
#   UNITY_EMAIL     your Unity account email
#   UNITY_PASSWORD  your Unity account password

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_NAME: MultiplayerFPS

jobs:
  build-windows:
    name: Build for Windows
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write # needed to create releases on tag pushes

    steps:
      - name: Check for Unity license
        id: license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::Cannot build the release: add the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD repository secrets."
            exit 1
          else
            echo "::warning::Skipping the build: the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD repository secrets are not set."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine version
        if: steps.license.outputs.available == 'true'
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # Test builds get a unique version so they never match players on a real release
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # The Unity Docker image is large, so make room on the runner first
      - name: Free disk space
        if: steps.license.outputs.available == 'true'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Check out repository
        if: steps.license.outputs.available == 'true'
        uses: actions/checkout@v4

      - name: Cache Unity Library folder
        if: steps.license.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneWindows64-

      - name: Build with Unity
        if: steps.license.outputs.available == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: ${{ env.BUILD_NAME }}
          versioning: Custom
          version: ${{ steps.version.outputs.version }}

      - name: Zip build
        if: steps.license.outputs.available == 'true'
        id: zip
        run: |
          ZIP_NAME="${BUILD_NAME}-${{ steps.version.outputs.version }}-Windows.zip"
          cd build/StandaloneWindows64
          # Leave out the debug folders Unity says not to ship
          zip -r -q "$GITHUB_WORKSPACE/$ZIP_NAME" . \
            -x '*_BurstDebugInformation_DoNotShip*' \
            -x '*_BackUpThisFolder_ButDontShipItWithYourGame*'
          echo "name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        if: steps.license.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-${{ steps.version.outputs.version }}-Windows
          path: ${{ steps.zip.outputs.name }}
          retention-days: 14

      - name: Publish GitHub Release
        if: steps.license.outputs.available == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Multiplayer FPS ${{ github.ref_name }}
          files: ${{ steps.zip.outputs.name }}
          generate_release_notes: true
