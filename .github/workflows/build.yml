name: Build

# Builds the Windows and browser (WebGL) versions of the game with GameCI (https://game.ci).
#  - Push a tag like v0.2 to build and publish a GitHub Release with the zipped Windows game,
#    and publish the browser version to GitHub Pages.
#    The tag (without the "v") becomes the game's version, which is also Photon's
#    matchmaking version, so different releases never share a room (and Windows and
#    browser players on the same release can play together).
#  - Pull requests that touch the project get test builds of both, downloadable from the run.
#  - "Run workflow" on the Actions tab builds on demand.
#  - The Windows build first runs the EditMode tests in Assets/Tests, and stops if any fail.
#
# Publishing the browser version needs GitHub Pages set up once:
#   1. Settings > Pages > Build and deployment > Source: "GitHub Actions"
#   2. Settings > Environments > github-pages > Deployment branches and tags:
#      add a tag rule "v*" (by default only the main branch may deploy there)
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   UNITY_LICENSE   contents of your Unity license file (Unity_lic.ulf)
#   UNITY_EMAIL     your Unity account email
#   UNITY_PASSWORD  your Unity account password

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_NAME: MultiplayerFPS

jobs:
  build:
    name: Build for ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            targetPlatform: StandaloneWindows64
          - name: WebGL
            targetPlatform: WebGL
    permissions:
      contents: write # needed to create releases on tag pushes
      checks: write # lets the test runner post a test results check

    steps:
      - name: Check for Unity license
        id: license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            # GameCI reads the serial from the license file's DeveloperData, so catch a wrong or partial file early
            if ! grep -q "DeveloperData" <<< "$UNITY_LICENSE"; then
              echo "::error::UNITY_LICENSE does not look like a Unity license file. Paste the full contents of Unity_lic.ulf (it starts with <?xml and contains a DeveloperData line)."
              exit 1
            fi
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::Cannot build the release: add the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD repository secrets."
            exit 1
          else
            echo "::warning::Skipping the build: the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD repository secrets are not set."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine version
        if: steps.license.outputs.available == 'true'
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # Test builds get a unique version so they never match players on a real release
            echo "version=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # The Unity Docker image is large, so make room on the runner first
      - name: Free disk space
        if: steps.license.outputs.available == 'true'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Check out repository
        if: steps.license.outputs.available == 'true'
        uses: actions/checkout@v4

      - name: Cache Unity Library folder
        if: steps.license.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-

      # The tests don't depend on the platform, so they only run in the Windows build
      - name: Run EditMode tests
        if: steps.license.outputs.available == 'true' && matrix.targetPlatform == 'StandaloneWindows64'
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode test results

      - name: Upload test results
        if: always() && steps.license.outputs.available == 'true' && matrix.targetPlatform == 'StandaloneWindows64'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          retention-days: 14

      - name: Build with Unity
        if: steps.license.outputs.available == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: ${{ env.BUILD_NAME }}
          versioning: Custom
          version: ${{ steps.version.outputs.version }}

      # ---- Windows: zip, upload, and attach to the release on tags ----
      - name: Zip build
        if: steps.license.outputs.available == 'true' && matrix.targetPlatform == 'StandaloneWindows64'
        id: zip
        run: |
          ZIP_NAME="${BUILD_NAME}-${{ steps.version.outputs.version }}-Windows.zip"
          cd build/StandaloneWindows64
          # Leave out the debug folders Unity says not to ship
          zip -r -q "$GITHUB_WORKSPACE/$ZIP_NAME" . \
            -x '*_BurstDebugInformation_DoNotShip*' \
            -x '*_BackUpThisFolder_ButDontShipItWithYourGame*'
          echo "name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        if: steps.license.outputs.available == 'true' && matrix.targetPlatform == 'StandaloneWindows64'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-${{ steps.version.outputs.version }}-Windows
          path: ${{ steps.zip.outputs.name }}
          retention-days: 14

      - name: Publish GitHub Release
        if: steps.license.outputs.available == 'true' && matrix.targetPlatform == 'StandaloneWindows64' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Multiplayer FPS ${{ github.ref_name }}
          files: ${{ steps.zip.outputs.name }}
          generate_release_notes: true

      # ---- WebGL: upload for testing, and hand the site to GitHub Pages on tags ----
      - name: Upload browser build artifact
        if: steps.license.outputs.available == 'true' && matrix.targetPlatform == 'WebGL'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-${{ steps.version.outputs.version }}-WebGL
          path: build/WebGL/${{ env.BUILD_NAME }}
          retention-days: 14

      - name: Prepare GitHub Pages site
        if: steps.license.outputs.available == 'true' && matrix.targetPlatform == 'WebGL' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/${{ env.BUILD_NAME }}

  # Publishes the browser version from the WebGL build above. Only on release tags.
  publish-web:
    name: Publish browser version
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
