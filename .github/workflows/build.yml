name: Build

# Builds the Windows and browser (WebGL) versions of the game with GameCI (https://game.ci).
#  - Push a tag like v0.2 to build and publish a GitHub Release with the zipped Windows game,
#    and publish the browser version to GitHub Pages.
#    The tag (without the "v") becomes the game's version, which is also Photon's
#    matchmaking version, so different releases never share a room (and Windows and
#    browser players on the same release can play together).
#  - Pull requests that touch the project get a browser (WebGL) test build, downloadable from
#    the run. It uses the "Shorter Build Time" code optimization (see the build job). They
#    don't build Windows; use "Run workflow" on the branch for a Windows test build.
#    Draft pull requests only run the tests; the builds start when the pull request is marked
#    ready for review.
#  - Pushes to main (merged pull requests) only run the tests, not the builds: the pull request
#    already built that code, and a release tag builds it again with its real version anyway.
#    The tests run there to save their Library cache on main for later pull requests to start
#    from. (A pull request can only use caches saved by itself or by main.)
#  - Builds always start from a clean Library; see the notes in the build job.
#  - "Run workflow" on the Actions tab builds on demand, also on main.
#  - The EditMode tests in Assets/Tests run in parallel with the builds. A release and the
#    browser version are only published when the tests and both builds pass.
#  - There's no "free disk space" step: the ubuntu-latest runners have about 88 GB free, far
#    more than the Unity image, Library and builds need, and freeing more took 1-2.5 minutes.
#
# Publishing the browser version needs GitHub Pages set up once:
#   1. Settings > Pages > Build and deployment > Source: "GitHub Actions"
#   2. Settings > Environments > github-pages > Deployment branches and tags:
#      add a tag rule "v*" (by default only the main branch may deploy there)
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   UNITY_LICENSE   contents of your Unity license file (Unity_lic.ulf)
#   UNITY_EMAIL     your Unity account email
#   UNITY_PASSWORD  your Unity account password

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    # Only for pushes to main; GitHub doesn't apply path filters to tag pushes
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/build.yml'
  pull_request:
    # The default types, plus ready_for_review to build a draft once it's marked ready
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_NAME: Capshots

jobs:
  # Checks the Unity license secrets and works out the version, once for all jobs below
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.license.outputs.available }}
      version: ${{ steps.version.outputs.version }}
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - name: Check for Unity license
        id: license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            # GameCI reads the serial from the license file's DeveloperData, so catch a wrong or partial file early
            if ! grep -q "DeveloperData" <<< "$UNITY_LICENSE"; then
              echo "::error::UNITY_LICENSE does not look like a Unity license file. Paste the full contents of Unity_lic.ulf (it starts with <?xml and contains a DeveloperData line)."
              exit 1
            fi
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::Cannot build the release: add the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD repository secrets."
            exit 1
          else
            echo "::warning::Skipping the build: the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD repository secrets are not set."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # Test builds get a unique version so they never match players on a real release
            echo "version=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # Pull requests only build WebGL; releases and "Run workflow" build both
      - name: Choose platforms to build
        id: platforms
        run: |
          webgl='{"name":"WebGL","targetPlatform":"WebGL"}'
          windows='{"name":"Windows","targetPlatform":"StandaloneWindows64"}'
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "platforms=[$webgl]" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=[$windows,$webgl]" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: EditMode tests
    needs: setup
    if: needs.setup.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write # lets the test runner post a test results check
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Unity Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Tests-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Tests-

      - name: Run EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode test results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          retention-days: 14

  build:
    name: Build for ${{ matrix.name }}
    needs: setup
    # Not on pushes to main (see the top of this file; "Run workflow" still builds main),
    # and not on draft pull requests
    if: >-
      needs.setup.outputs.available == 'true' &&
      (github.ref != 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Set by the setup job: WebGL on pull requests, Windows and WebGL otherwise
        include: ${{ fromJSON(needs.setup.outputs.platforms) }}
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.setup.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Builds always start from a clean Library. A cached Library didn't make them any faster:
      # Unity still compiled every shader variant and nearly all the IL2CPP C++ code (measured
      # on runs #50 and #53), and builds from a restored Library were sometimes killed with
      # exit code 137. The tests job still caches its Library.
      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: ${{ env.BUILD_NAME }}
          versioning: Custom
          version: ${{ env.VERSION }}
          # Pull request WebGL builds use the "Shorter Build Time" Code Optimization instead of
          # the default, skipping most of the C++ and WebAssembly optimization. The test build is
          # larger and runs slower than a release, but works the same. Releases keep the default.
          # Set by Assets/Editor/CIWebGLCodeOptimization.cs.
          customParameters: ${{ github.event_name == 'pull_request' && matrix.targetPlatform == 'WebGL' && '-webglCodeOptimization BuildTimes' || '' }}

      # ---- Windows: zip and upload (the release job attaches it on tags) ----
      - name: Zip build
        if: matrix.targetPlatform == 'StandaloneWindows64'
        run: |
          cd build/StandaloneWindows64
          # Leave out the debug folders Unity says not to ship
          zip -r -q "$GITHUB_WORKSPACE/${BUILD_NAME}-${VERSION}-Windows.zip" . \
            -x '*_BurstDebugInformation_DoNotShip*' \
            -x '*_BackUpThisFolder_ButDontShipItWithYourGame*'

      - name: Upload build artifact
        if: matrix.targetPlatform == 'StandaloneWindows64'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-${{ env.VERSION }}-Windows
          path: ${{ env.BUILD_NAME }}-${{ env.VERSION }}-Windows.zip
          retention-days: 14

      # ---- WebGL: upload for testing, and hand the site to GitHub Pages on tags ----
      - name: Upload browser build artifact
        if: matrix.targetPlatform == 'WebGL'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-${{ env.VERSION }}-WebGL
          path: build/WebGL/${{ env.BUILD_NAME }}
          retention-days: 14

      - name: Prepare GitHub Pages site
        if: matrix.targetPlatform == 'WebGL' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/${{ env.BUILD_NAME }}

  # Publishes the GitHub Release with the Windows zip. Only on release tags, and only when
  # the tests and both builds passed.
  release:
    name: Publish release
    needs: [setup, test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the release
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-${{ needs.setup.outputs.version }}-Windows

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Capshots ${{ github.ref_name }}
          files: ${{ env.BUILD_NAME }}-${{ needs.setup.outputs.version }}-Windows.zip
          generate_release_notes: true

  # Publishes the browser version from the WebGL build above. Only on release tags, and only
  # when the tests and both builds passed.
  publish-web:
    name: Publish browser version
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
